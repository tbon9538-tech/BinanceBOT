[project]
name = "binance-bot"
version = "0.1.0"
description = "币安现货趋势–动量轮动机器人（核心–卫星），见 doc/binance_momentum_bot_spec.md"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "matplotlib>=3.9",
    "filelock>=3.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.uv]
# 应用项目，不打包安装；从项目根目录以 `python -m bot` 运行
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 单元测试禁止访问网络（pytest-socket），见 doc/DECISIONS.md D-023
addopts = "-q --disable-socket"

[tool.ruff]
line-length = 110
target-version = "py311"
# 不检查、不格式化文档（新版 ruff 会格式化 Markdown 中的 Python 代码块）
extend-exclude = ["doc", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文注释和字符串中的全角标点会触发"易混淆 Unicode 字符"规则
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["bot"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
