[project]
name = "binance-bot"
version = "1.0.0"
description = "币安现货趋势–动量轮动机器人（核心–卫星），见 doc/binance_momentum_bot_spec.md"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "matplotlib>=3.9",
    "filelock>=3.15",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.uv]
# 应用项目，不打包安装；从项目根目录以 `python -m bot` 运行
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 单元测试禁止访问网络（pytest-socket），见 doc/DECISIONS.md D-023；Unix 域套接字不出本机，asyncio 事件循环需要（D-075）
addopts = "-q --disable-socket --allow-unix-socket"
# starlette 1.x 提示 TestClient 改用 httpx2；目前仍兼容，等它真正移除时再换
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py311"
# 不检查、不格式化文档（新版 ruff 会格式化 Markdown 中的 Python 代码块）
extend-exclude = ["doc", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文注释和字符串中的全角标点会触发"易混淆 Unicode 字符"规则
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # 行宽由 ruff format 控制；中文长字符串不强制折行

[tool.mypy]
python_version = "3.11"
strict = true
files = ["bot"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# 数据分析模块大量使用 pandas 标量访问（.at/.loc），pandas-stubs 把返回值标成很宽的 Union，
# 会产生大量与逻辑无关的报错。这些模块保留 strict 的其余检查，只关闭下列错误码（doc/DECISIONS.md D-051）。
[[tool.mypy.overrides]]
module = ["bot.strategy.*", "bot.backtest.*", "bot.app.research_commands"]
disable_error_code = ["arg-type", "call-overload", "union-attr", "operator", "no-any-return", "index", "misc", "return-value", "assignment", "var-annotated", "attr-defined"]
